[project]
name = "plutus-hr-system"
version = "0.1.0"
description = "Plutus — compliance-native HR and payroll platform for Nigeria and Africa"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "email-validator>=2.2",
    "slowapi>=0.1.10",
    "reportlab>=5.0.1",
    "httpx>=0.28.1",
    "apscheduler>=3.10,<4",
    "pillow>=11.0",
    "boto3>=1.34",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "hypothesis>=6.115",
    "types-reportlab>=4.5.1.20260827",
    "boto3-stubs[s3]>=1.34",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "alembic/versions"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true

# apscheduler ships no py.typed marker and no types-apscheduler stub package
# exists on PyPI to install instead (checked at the time this was added).
[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
